# Cloudflare Pages — საიტი (dist/) + Pages Functions (functions/) + D1 ბაზა შეფასებებისთვის.
# დაყენების ინსტრუქცია: README.md → „შეფასებები (Cloudflare)“.
name = "keraceiling"
compatibility_date = "2025-11-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "keraceiling-reviews"
database_id = "e6247633-2bcf-4df3-9b9e-d2783383b002"
migrations_dir = "migrations"

# საიდუმლო მნიშვნელობები აქ არ იწერება. Cloudflare-ში: Settings → Variables and Secrets,
# ლოკალურად: .dev.vars ფაილი (იხ. .dev.vars.example).
#   REVIEW_SECRET       — ხელმოწერის გასაღები (გრძელი შემთხვევითი სტრიქონი)
#   ADMIN_KEY           — ადმინ-გვერდის პაროლი (/api/reviews/admin)
#   TELEGRAM_BOT_TOKEN  — (სურვილისამებრ) შეტყობინებები ახალ შეფასებაზე
#   TELEGRAM_CHAT_ID    — (სურვილისამებრ) ვისთან მივიდეს შეტყობინება
