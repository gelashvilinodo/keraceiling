# Cloudflare Workers — საიტი (dist/, static assets) + API (worker/index.ts) + D1 ბაზა შეფასებებისთვის.
# დაყენების ინსტრუქცია: README.md → „შეფასებები (Cloudflare)“.
name = "keraceiling"
main = "worker/index.ts"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# არარსებული გვერდი → dist/404.html; /review → /review/
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker ეშვება მხოლოდ API-სთვის — დანარჩენი ფაილები პირდაპირ, სწრაფად ემსახურება
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "keraceiling-reviews"
database_id = "e6247633-2bcf-4df3-9b9e-d2783383b002"
migrations_dir = "migrations"

[observability]
enabled = true

# საიდუმლო მნიშვნელობები აქ არ იწერება. Cloudflare-ში: Worker → Settings → Variables and Secrets,
# ლოკალურად: .dev.vars ფაილი (იხ. .dev.vars.example).
#   REVIEW_SECRET       — ხელმოწერის გასაღები (გრძელი შემთხვევითი სტრიქონი)
#   ADMIN_KEY           — ადმინ-გვერდის პაროლი (/api/reviews/admin)
#   TELEGRAM_BOT_TOKEN  — (სურვილისამებრ) შეტყობინებები ახალ შეფასებაზე
#   TELEGRAM_CHAT_ID    — (სურვილისამებრ) ვისთან მივიდეს შეტყობინება
